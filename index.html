<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abie Business — правовые документы</title>
<style>
  :root{--bg:#ffffff;--fg:#1a1c1e;--muted:#5f6368;--line:#e0e2e6;--accent:#3b5bdb;--card:#f6f8fa}
  @media (prefers-color-scheme:dark){:root{--bg:#131416;--fg:#e3e3e6;--muted:#a0a4a8;--line:#2c2f33;--accent:#8ea2ff;--card:#1b1e21}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  main{max-width:620px;margin:0 auto;padding:64px 22px 80px}
  h1{font-size:1.9rem;margin:0 0 .2em}
  .sub{color:var(--muted);margin:0 0 2.4em}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;transition:border-color .15s}
  a.card:hover{border-color:var(--accent)}
  a.card .t{font-weight:600;font-size:1.05rem}
  a.card .d{color:var(--muted);font-size:.9rem;margin-top:.25em}
  footer{margin-top:3em;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
<h1>Abie Business</h1>
<p class="sub">Корпоративный чат и CRM · правовые документы</p>

<a class="card" href="privacy-policy.html">
  <div class="t">Политика конфиденциальности →</div>
  <div class="d">Какие данные обрабатываются, где хранятся и кто оператор</div>
</a>
<a class="card" href="data-deletion.html">
  <div class="t">Удаление данных →</div>
  <div class="d">Как запросить удаление данных приложения</div>
</a>

<footer>Контакт разработчика: alexandertsar48@gmail.com</footer>
</main>
</body>
</html>
